<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Totally Gone Bananas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --brown:#462018; --yellow:#F3CF31; --cream:#FBF9E6; --orange:#E8793A;
  --bg:#FBF9E6; --paper:#FFFDF2; --panel:#F4EDCB; --ink:#462018; --muted:#6E4A3F;
  --line:#462018; --on-yellow:#462018; --on-orange:#462018; --danger:#B3261E; --ok:#2E6B30;
  --display:"Shrikhand","Cooper Black","Georgia",serif;
  --body:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#24110C;--paper:#331913;--panel:#3D1F17;--ink:#FBF9E6;--muted:#E2D5B8;--line:#FBF9E6;--danger:#FF8A80;--ok:#9BE39F;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#24110C;--paper:#331913;--panel:#3D1F17;--ink:#FBF9E6;--muted:#E2D5B8;--line:#FBF9E6;--danger:#FF8A80;--ok:#9BE39F;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:10px}
h1:focus,h2:focus{outline:none}
[hidden]{display:none!important}
.wrap{width:min(1160px,100% - 2.5rem);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.owner-only{display:none!important}
body.owner .owner-only{display:inline-flex!important}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:3px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding-block:.5rem}
.brand{display:flex;flex-shrink:0}
.brand img{width:64px;height:auto;display:block;transition:transform .25s}
.brand:hover img{transform:rotate(-6deg)}
nav.main{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;flex:1}
nav.main::-webkit-scrollbar{display:none}
nav.main a{padding:.45rem .8rem;border-radius:999px;font-weight:800;white-space:nowrap;font-size:.95rem;text-decoration:none}
nav.main a[aria-current="page"]{background:var(--yellow);color:var(--on-yellow);box-shadow:inset 0 0 0 2.5px var(--brown)}
nav.main a:not([aria-current]):hover{background:var(--panel)}
.streak{flex-shrink:0;display:flex;align-items:center;gap:.4rem;padding:.35rem .8rem;border:2.5px solid var(--line);border-radius:999px;font-weight:900;font-size:.9rem;background:var(--paper);text-decoration:none}
.streak b{font-size:1.05rem}
.notice{background:var(--orange);color:var(--on-orange);border-bottom:3px solid var(--brown)}
.notice .wrap{display:flex;gap:.8rem;align-items:center;padding-block:.55rem;font-weight:800;flex-wrap:wrap}
.notice a{font-weight:900}
.notice button{margin-left:auto;background:none;border:0;font-weight:900;cursor:pointer;color:inherit;min-height:40px;text-decoration:underline}

/* shared type */
.page-head{padding:clamp(1.8rem,4vw,3rem) 0 1.2rem}
.h1,.page-head h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,5.2vw,4rem);line-height:1;margin:0 0 .7rem;letter-spacing:-.01em;text-wrap:balance}
.lede{font-size:1.12rem;max-width:52ch;margin:0;color:var(--muted);font-weight:600}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.05;margin:0;text-wrap:balance}
section.block{padding:clamp(2rem,5vw,3.5rem) 0}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
.sec-head p{margin:.35rem 0 0;color:var(--muted);font-weight:600;max-width:52ch}
.tools{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.muted{color:var(--muted);font-weight:700}

/* hero */
.hero{padding:clamp(1.5rem,4vw,3rem) 0 .5rem;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:1rem 2rem;align-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,6vw,4.9rem);line-height:.98;margin:0 0 1rem;letter-spacing:-.01em;text-wrap:balance}
.mascot{display:flex;flex-direction:column;align-items:center}
.bubble{position:relative;align-self:flex-start;margin-left:6%;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:.6rem 1rem .7rem;max-width:28ch;box-shadow:5px 5px 0 var(--line)}
.bubble::after{content:"";position:absolute;left:3.2rem;bottom:-15px;width:22px;height:22px;background:var(--paper);border-right:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.bubble strong{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.15}
.bubble span{font-weight:700;font-size:.98rem;color:var(--muted)}
.mascot-svg{width:100%;max-width:470px;height:auto;display:block;overflow:visible}
.mascot-svg .body-g{transform-origin:200px 150px}
.mascot-svg.hop .body-g{animation:hop .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes hop{0%{transform:none}35%{transform:translateY(-26px) rotate(-5deg)}70%{transform:translateY(0) rotate(2deg)}100%{transform:none}}
.sweat{animation:drip 1.2s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(18px);opacity:0}}
.skater{position:absolute;left:0;bottom:4px;width:110px;pointer-events:none;transform:translateX(-160px);animation:skate 3.2s .5s cubic-bezier(.45,.05,.4,1) forwards}
@keyframes skate{0%{transform:translateX(-160px)}60%{transform:translateX(calc(100vw - 120px)) rotate(-4deg)}100%{transform:translateX(calc(100vw + 60px))}}

/* category stickers */
.cats{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.6rem}
.cat{display:flex;align-items:center;gap:.6rem;padding:.4rem 1rem .4rem .4rem;border:3px solid var(--line);border-radius:999px;background:var(--paper);font-weight:900;cursor:pointer;box-shadow:4px 4px 0 var(--line);transition:transform .12s,box-shadow .12s;min-height:52px}
.cat .ce{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;border:2.5px solid var(--brown)}
.cat small{font-weight:800;color:var(--muted);font-size:.8rem}
.cat:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.cat:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.cat[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow);border-color:var(--brown)}
.cat[aria-pressed="true"] small{color:var(--on-yellow)}
.cats.small{margin:0 0 .9rem;gap:.55rem}
.cats.small .cat{min-height:44px;box-shadow:3px 3px 0 var(--line);padding-right:.85rem}
.cats.small .ce{width:30px;height:30px;font-size:1.05rem}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.4rem}
.card{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:26px;box-shadow:6px 6px 0 var(--line);display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--line)}
.card.pop{animation:pop .42s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.9) rotate(-2deg)}to{opacity:1;transform:none}}
.art{height:150px;display:grid;place-items:center;font-size:4.2rem;border-bottom:3px solid var(--line);position:relative;overflow:hidden}
.art img,.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag-cat{position:absolute;left:12px;bottom:10px;z-index:1;font-size:.78rem;font-weight:900;background:var(--cream);color:var(--brown);border:2.5px solid var(--brown);border-radius:999px;padding:.1rem .6rem}
.card .inner{padding:1rem 1.1rem 1.15rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.card h3{margin:0;font-size:1.2rem;line-height:1.2;font-weight:900}
.card h3 a{text-decoration:none}
.card h3 a::after,.row a.cover::after{content:"";position:absolute;inset:0;z-index:0}
.card h3 a:focus-visible,.row a.cover:focus-visible{outline:none}
.card:has(h3 a:focus-visible),.row:has(a.cover:focus-visible){outline:3px solid var(--orange);outline-offset:4px}
.card p{margin:0;font-size:.95rem;color:var(--muted);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto;padding-top:.3rem}
.pill{font-size:.78rem;font-weight:800;border:2px solid var(--line);border-radius:999px;padding:.12rem .6rem;white-space:nowrap}
.pill.time{background:var(--yellow);color:var(--on-yellow);border-color:var(--brown)}
.pill.rate{background:var(--orange);color:var(--on-orange);border-color:var(--brown)}
.diff{letter-spacing:-1px}
.diff .off{opacity:.25;filter:grayscale(1)}
.heart{position:absolute;top:10px;right:10px;z-index:2;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--brown);background:var(--cream);display:grid;place-items:center;cursor:pointer;transition:transform .12s;flex-shrink:0}
.heart svg{width:22px;height:22px;fill:none;stroke:var(--brown);stroke-width:2.4}
.heart[aria-pressed="true"] svg{fill:var(--orange)}
.heart:active{transform:scale(.85)}
.heart.inline{position:static}
.empty{grid-column:1/-1;background:var(--panel);border:3px dashed var(--line);border-radius:24px;padding:2rem;text-align:center;font-weight:700;display:grid;gap:.6rem;justify-items:center}
.empty .big{font-size:2.4rem}

/* compact rows */
.rows{display:grid;gap:.8rem}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:.9rem;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:.6rem .9rem .6rem .6rem;box-shadow:4px 4px 0 var(--line);position:relative}
.row .end{z-index:1;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.thumb{width:64px;height:64px;border-radius:14px;border:2.5px solid var(--line);display:grid;place-items:center;font-size:2rem;overflow:hidden;position:relative}
.row h3{margin:0;font-size:1.05rem;font-weight:900;line-height:1.25}
.row a.cover{text-decoration:none}
.row p{margin:.1rem 0 0;font-size:.9rem;font-weight:700;color:var(--muted)}
.row p.ok{color:var(--ok)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:999px;border:3px solid var(--brown);background:var(--yellow);color:var(--on-yellow);font-weight:900;cursor:pointer;box-shadow:4px 4px 0 var(--line);transition:transform .1s,box-shadow .1s;min-height:48px;text-decoration:none;text-align:center}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.btn:active{transform:translate(3px,3px) scale(.97);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
.btn.dark{background:var(--brown);color:var(--cream);border-color:var(--brown)}
.btn.danger{background:var(--paper);color:var(--danger);border-color:var(--danger);box-shadow:4px 4px 0 var(--danger)}
.btn.small{min-height:40px;padding:.4rem 1rem;font-size:.9rem;box-shadow:3px 3px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.chip{border:2.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.3rem .8rem;font-weight:800;font-size:.85rem;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:.35rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:28px;padding:1.3rem 1.4rem 1.4rem;box-shadow:6px 6px 0 var(--line)}
.panel h2{font-size:1.7rem;margin-bottom:.3rem}
.panel > p{margin:0 0 .9rem;color:var(--muted);font-weight:600;font-size:.95rem}
.field,.sel select{width:100%;padding:.65rem .85rem;border:3px solid var(--line);border-radius:14px;background:var(--bg);font-weight:700;min-height:48px}
.sel{display:grid;gap:.25rem;font-weight:900;font-size:.85rem}
.search{position:relative;width:min(320px,100%)}
.search input{width:100%;padding:.75rem 1rem .75rem 2.6rem;border:3px solid var(--line);border-radius:999px;background:var(--paper);font-weight:700;min-height:48px}
.search input::placeholder{color:var(--muted);opacity:.85}
.search svg{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);width:18px;height:18px}

/* home daily band */
.daily{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:1.6rem}
.rotd{align-self:start;background:var(--yellow);color:var(--brown);border:3px solid var(--brown);border-radius:32px;box-shadow:8px 8px 0 var(--line);padding:clamp(1.3rem,3vw,2.2rem);display:grid;grid-template-columns:auto 1fr;gap:.4rem 1.5rem;align-content:start}
.rotd .emo{grid-row:span 3;font-size:clamp(4.5rem,9vw,7rem);line-height:1;background:var(--cream);border:3px solid var(--brown);border-radius:50%;width:1.55em;height:1.55em;display:grid;place-items:center;align-self:start;overflow:hidden;position:relative}
.rotd .kicker{font-weight:900;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.rotd .count{font-variant-numeric:tabular-nums;background:var(--brown);color:var(--cream);border-radius:999px;padding:.05rem .65rem;font-size:.85rem}
.rotd h2{font-size:clamp(1.9rem,4vw,2.9rem)}
.rotd p{margin:.2rem 0 .6rem;font-weight:700;max-width:46ch}
.rotd ul{grid-column:1/-1;margin:.6rem 0 1rem;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.45rem}
.rotd li{background:var(--cream);border:2px solid var(--brown);border-radius:999px;padding:.15rem .7rem;font-weight:700;font-size:.9rem}
.rotd .actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
.rotd .btn{background:var(--brown);color:var(--cream);box-shadow:4px 4px 0 var(--brown)}
.side{display:grid;gap:1.6rem;align-content:start}
.reel{height:68px;border:3px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden;position:relative;margin-bottom:.9rem}
.reel-item,.reel a.result{height:62px;display:flex;align-items:center;gap:.7rem;padding:0 1rem;font-weight:900;font-size:1.05rem;line-height:1.15;text-decoration:none}
.reel .e{font-size:2rem}
.reel a.result:focus-visible{outline:3px solid var(--orange);outline-offset:-5px;border-radius:14px}
.flip{perspective:900px;border:0;background:none;padding:0;width:100%;cursor:pointer;text-align:left;display:block}
.flip .faces{position:relative;min-height:170px;transition:transform .55s cubic-bezier(.4,1.3,.5,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .faces{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--line);border-radius:28px;padding:1.3rem 1.4rem;box-shadow:6px 6px 0 var(--line);display:flex;flex-direction:column;justify-content:center;gap:.4rem}
.face.front{background:var(--orange);color:var(--on-orange);border-color:var(--brown)}
.face.front strong{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.1}
.face.front span{font-weight:800}
.face.back{background:var(--paper);transform:rotateY(180deg);font-weight:700}
.face.back small{font-weight:900;color:var(--muted);font-size:.85rem}

/* browse */
.filters{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end;margin-bottom:1.1rem}
.filters .search{width:min(360px,100%)}
.filters .sel{min-width:150px}
.result-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin:.4rem 0 1.3rem}
.result-bar p{margin:0;font-weight:800;color:var(--muted)}

/* detail */
.crumbs{display:flex;gap:.5rem;flex-wrap:wrap;font-weight:800;padding-top:1.4rem;color:var(--muted)}
.d-hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:2rem;align-items:center;padding:1rem 0 2.2rem}
.d-art{aspect-ratio:4/3;border:3px solid var(--line);border-radius:32px;box-shadow:8px 8px 0 var(--line);display:grid;place-items:center;font-size:clamp(6rem,14vw,9rem);position:relative;overflow:hidden}
.d-hero .lede{margin-bottom:1rem}
.d-actions{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-top:1.3rem}
.d-body{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:2rem;align-items:start}
.ing-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
.scale{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.2rem 0 1rem;font-weight:900}
.stepper{display:inline-flex;align-items:center;gap:.4rem}
.stepper button{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);background:var(--paper);font-weight:900;font-size:1.25rem;cursor:pointer;line-height:1}
.stepper output{min-width:2.2ch;text-align:center;font-size:1.25rem}
.checks{margin:0;padding:0;list-style:none;display:grid;gap:.45rem}
.checks label{display:flex;gap:.6rem;align-items:flex-start;font-weight:700;cursor:pointer}
.checks input{width:22px;height:22px;accent-color:#462018;margin-top:.12rem;flex-shrink:0}
.checks input:checked + span{text-decoration:line-through;opacity:.55}
b.scaled{background:var(--yellow);color:var(--on-yellow);border-radius:6px;padding:0 .25rem}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:1.1rem}
ol.steps > li{counter-increment:s;display:grid;grid-template-columns:2.4rem 1fr;gap:.8rem;font-weight:600;font-size:1.08rem}
ol.steps > li::before{content:counter(s);width:2.4rem;height:2.4rem;border-radius:50%;background:var(--yellow);color:var(--on-yellow);border:2.5px solid var(--brown);display:grid;place-items:center;font-weight:900}
.tchips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
.made-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:2rem;align-items:start}
.rate-row{position:relative;display:flex;gap:.2rem;border:0;padding:0;margin:.3rem 0 1rem}
.rate-row legend{font-weight:900;margin-bottom:.3rem;padding:0}
.rate-row input{position:absolute;opacity:0;width:1px;height:1px}
.rate-row label{font-size:2.1rem;cursor:pointer;filter:grayscale(1);opacity:.35;transition:transform .1s,opacity .1s;line-height:1;padding:.1rem}
.rate-row label.on{filter:none;opacity:1}
.rate-row label:hover{transform:scale(1.15)}
.rate-row input:focus-visible + label{outline:3px solid var(--orange);border-radius:10px}
.reviews{list-style:none;padding:0;margin:0;display:grid;gap:.8rem}
.review{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;padding:.8rem 1rem}
.review .who{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-weight:900}
.review p{margin:.3rem 0 0;font-weight:600}
.linkbtn{background:none;border:0;padding:0;font-weight:800;color:var(--danger);cursor:pointer;text-decoration:underline;margin-left:auto;min-height:32px}

/* cook mode */
dialog#cook{color:var(--ink);width:100%;height:100%;max-width:100%;max-height:100%;margin:0;border:0;border-radius:0;box-shadow:none;background:var(--bg);padding:0}
dialog#cook[open]{animation:none}
.cook{display:flex;flex-direction:column;height:100%;padding:calc(env(safe-area-inset-top,0px) + 1rem) clamp(1rem,4vw,3rem) calc(env(safe-area-inset-bottom,0px) + 1rem);gap:1rem}
.cook-top{display:flex;align-items:center;gap:1rem}
.cook-top h2{font-size:clamp(1.2rem,3vw,1.7rem);flex:1}
.cook-top .close{position:static}
.progress{height:14px;border:3px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.progress i{display:block;height:100%;background:var(--yellow);transition:width .3s}
.cook-main{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:1.2rem;max-width:920px;margin-inline:auto;width:100%}
.cook-step-n{font-weight:900;color:var(--muted);font-size:1.05rem}
.cook-text{font-size:clamp(1.6rem,4.2vw,2.8rem);font-weight:800;line-height:1.3;margin:0}
.cook-side{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.cook-side .mascot-svg{width:160px}
.cook details{border:3px solid var(--line);border-radius:18px;padding:.6rem 1rem;background:var(--paper)}
.cook summary{font-weight:900;cursor:pointer;min-height:36px;display:flex;align-items:center}
.cook-nav{display:flex;gap:1rem;max-width:920px;margin-inline:auto;width:100%}
.cook-nav .btn{flex:1;min-height:64px;font-size:1.15rem}
.wake{font-weight:800;color:var(--muted);font-size:.9rem}

/* timers */
.dock{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;display:grid;gap:.5rem;justify-items:end}
.tm{display:flex;align-items:center;gap:.5rem;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:999px;padding:.3rem .4rem .3rem .9rem;font-weight:900;box-shadow:4px 4px 0 var(--line);font-variant-numeric:tabular-nums;max-width:calc(100vw - 2rem)}
.tm span.l{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem;color:var(--muted)}
.tm.done{background:var(--orange);color:var(--on-orange);border-color:var(--brown);animation:shake .6s ease-in-out infinite}
.tm.done span.l{color:var(--on-orange)}
.tm button{width:34px;height:34px;border-radius:50%;border:2px solid var(--brown);background:var(--cream);color:var(--brown);font-weight:900;cursor:pointer}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}

/* pantry */
.pantry-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:2rem;align-items:start}
.pgroup h3{margin:1rem 0 .45rem;font-size:1rem;font-weight:900}
.pgroup .chips{margin:0}
.pchip[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow);border-color:var(--brown)}
.res-sec{margin-bottom:1.8rem}
.res-sec h2{font-size:1.6rem;margin-bottom:.8rem}
details.more summary{font-weight:900;cursor:pointer;margin-bottom:.8rem;min-height:40px;display:flex;align-items:center}

/* challenge */
.chal-hero{display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:center;background:var(--yellow);color:var(--brown);border:3px solid var(--brown);border-radius:32px;box-shadow:8px 8px 0 var(--line);padding:clamp(1.3rem,3vw,2.2rem);margin-top:1.6rem}
.chal-emoji{font-size:clamp(3.5rem,8vw,6rem);width:1.5em;height:1.5em;display:grid;place-items:center;background:var(--cream);border:3px solid var(--brown);border-radius:50%}
.chal-hero .h1{margin-bottom:.4rem}
.chal-hero p{margin:0 0 .6rem;font-weight:700;max-width:56ch}
.chal-hero .count{display:inline-block;font-variant-numeric:tabular-nums;background:var(--brown);color:var(--cream);border-radius:999px;padding:.1rem .75rem;font-weight:900;font-size:.9rem}
.two-col{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:2rem;align-items:start}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.2rem}
.entry{background:var(--paper);border:3px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:5px 5px 0 var(--line);display:flex;flex-direction:column}
.entry .ph{aspect-ratio:1;position:relative;border-bottom:3px solid var(--line);background:var(--panel)}
.entry .rank{position:absolute;top:10px;left:10px;background:var(--cream);color:var(--brown);border:2.5px solid var(--brown);border-radius:999px;padding:.05rem .6rem;font-weight:900;font-size:.85rem}
.entry .body{padding:.8rem 1rem 1rem;display:grid;gap:.45rem;flex:1;align-content:start}
.entry .body p{margin:0;font-weight:700}
.entry .by{font-weight:800;color:var(--muted);font-size:.88rem}
.entry .foot{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:auto}
.vote{display:inline-flex;gap:.4rem;align-items:center;border:2.5px solid var(--line);border-radius:999px;padding:.3rem .85rem;font-weight:900;background:var(--paper);cursor:pointer;min-height:40px}
.vote[aria-pressed="true"]{background:var(--orange);color:var(--on-orange);border-color:var(--brown)}
.vote:disabled{cursor:default;opacity:.7}
.champ{display:grid;grid-template-columns:120px 1fr;gap:1rem;align-items:center;margin-top:1.6rem}
.champ .ph{width:120px;height:120px;border-radius:20px;border:3px solid var(--line);overflow:hidden;position:relative;background:var(--panel)}
.champ p{margin:.2rem 0 0;font-weight:700}
.photo-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.photo-prev{width:112px;height:112px;border:3px solid var(--line);border-radius:20px;display:grid;place-items:center;font-size:3rem;overflow:hidden;background:var(--bg);position:relative;flex-shrink:0}
.photo-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stack{display:grid;gap:.9rem}

/* quiz */
.quiz-card{max-width:760px;margin:0 auto;background:var(--paper);border:3px solid var(--line);border-radius:32px;box-shadow:8px 8px 0 var(--line);padding:clamp(1.4rem,4vw,2.6rem)}
.qdots{display:flex;gap:.45rem;margin-bottom:1.1rem}
.qdots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line)}
.qdots i.on{background:var(--yellow);border-color:var(--brown)}
.qopts{display:grid;gap:.7rem;margin-top:1.3rem}
.qopt{text-align:left;padding:.85rem 1.1rem;border:3px solid var(--line);border-radius:18px;background:var(--bg);font-weight:800;cursor:pointer;box-shadow:4px 4px 0 var(--line);display:flex;gap:.9rem;align-items:center;min-height:58px;transition:transform .1s,box-shadow .1s}
.qopt:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.qopt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.qopt .qe{font-size:1.7rem}
.result{text-align:center;display:grid;justify-items:center;gap:.6rem}
.result .disc{width:min(320px,80%);aspect-ratio:1;border-radius:50%;border:3px solid var(--brown);display:grid;place-items:center;padding:1.4rem}
.result p{max-width:52ch;font-weight:700;margin:0}
.result .actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:.6rem}
.result .row{text-align:left;width:100%;max-width:520px}

/* stand */
.stand-hero{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:2rem;align-items:center;padding-top:1.4rem}
.stand-hero .mascot-svg{max-width:420px}
.bar{height:22px;border:3px solid var(--line);border-radius:999px;background:var(--paper);overflow:hidden;margin:.5rem 0 .3rem}
.bar i{display:block;height:100%;background:var(--yellow);border-right:3px solid var(--brown)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:.8rem;margin-top:1.3rem}
.stat{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:.7rem .9rem}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1}
.stat span{font-weight:800;color:var(--muted);font-size:.85rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.badge{border:3px solid var(--line);border-radius:20px;padding:.8rem;text-align:center;background:var(--paper);display:grid;gap:.2rem;align-content:start}
.badge .be{font-size:2.2rem}
.badge b{font-weight:900;line-height:1.2}
.badge small{font-weight:700;color:var(--muted);line-height:1.3}
.badge.locked{border-style:dashed;background:transparent}
.badge.locked .be{filter:grayscale(1);opacity:.45}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:1rem}
.ms{border:2.5px solid var(--line);border-radius:16px;padding:.6rem .4rem;text-align:center;font-weight:800;font-size:.85rem;background:var(--paper);display:grid;gap:.1rem}
.ms .me{font-size:1.5rem}
.ms.now{background:var(--yellow);color:var(--on-yellow);border-color:var(--brown)}
.ms.past{opacity:.5}
.stand-sec{margin-top:clamp(2rem,5vw,3rem)}
.stand-sec > h2{margin-bottom:1rem}
.quiz-card .mascot-svg{max-width:280px}
.board-new{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.board-new input{width:min(300px,100%)}
.row select{max-width:170px;padding:.35rem .6rem;border:2.5px solid var(--line);border-radius:12px;background:var(--bg);font-weight:800;font-size:.85rem;min-height:40px}

/* about */
.about{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:2.5rem;align-items:start;padding-bottom:2rem}
.about p{font-weight:600;max-width:60ch}
.about h2{margin:1.8rem 0 .6rem;font-size:1.7rem}
.ripe-guide{display:grid;gap:.6rem;margin:0;padding:0;list-style:none}
.ripe-guide li{display:grid;grid-template-columns:28px 1fr;gap:.7rem;align-items:start;font-weight:600}
.ripe-guide i{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--brown);margin-top:.1rem}

footer{border-top:3px solid var(--line);padding:2rem 0 2.5rem;margin-top:2rem}
footer .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:1.2rem 2rem}
footer img{width:84px}
footer p{margin:0;font-weight:700;color:var(--muted);max-width:40ch}
footer nav{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-weight:800}

/* dialog */
dialog#dlg{border:3px solid var(--line);border-radius:30px;padding:0;background:var(--paper);color:var(--ink);width:min(600px,calc(100% - 1.5rem));max-height:calc(100% - 2rem);box-shadow:10px 10px 0 var(--line)}
dialog::backdrop{background:rgba(70,32,24,.55)}
dialog#dlg[open]{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.close{position:absolute;top:12px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--brown);background:var(--cream);color:var(--brown);font-size:1.4rem;font-weight:900;cursor:pointer;line-height:1;flex-shrink:0}
.rform{padding:1.4rem 1.5rem 1.6rem}
.rform h2{margin-bottom:.3rem;padding-right:3rem}
.rform > p{margin:0 0 1.1rem;color:var(--muted);font-weight:600}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:.95rem 1rem}
.f{display:grid;gap:.3rem;font-weight:900;font-size:.95rem;align-content:start}
.f.wide{grid-column:1/-1}
.f small{font-weight:700;color:var(--muted)}
.f input:not([type=checkbox]):not([type=file]),.f select,.f textarea{width:100%;padding:.65rem .85rem;border:3px solid var(--line);border-radius:14px;background:var(--bg);font-weight:700;min-height:48px}
.f textarea{resize:vertical;line-height:1.45}
fieldset.f{border:0;padding:0;margin:0}
fieldset.f legend{padding:0;margin-bottom:.35rem}
.tagbox{display:flex;flex-wrap:wrap;gap:.45rem}
.tagbox label{display:inline-flex;gap:.4rem;align-items:center;border:2.5px solid var(--line);border-radius:999px;padding:.3rem .8rem;font-weight:800;font-size:.88rem;cursor:pointer;min-height:40px}
.tagbox input{accent-color:#462018;width:18px;height:18px}
.photo-btns{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.emoji-in{width:5.5rem!important;text-align:center;font-size:1.3rem}
.f-err{color:var(--danger);font-weight:800;margin:.9rem 0 0;min-height:1.2em}
.newcat{display:grid;grid-template-columns:1fr auto;gap:.6rem;grid-column:1/-1}
.dlg-actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.3rem;align-items:center}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);visibility:hidden;background:var(--brown);color:var(--cream);border:3px solid var(--cream);border-radius:20px;padding:.8rem 1.2rem;font-weight:800;z-index:60;max-width:calc(100% - 2rem);transition:transform .35s cubic-bezier(.3,1.4,.5,1),visibility 0s .35s;box-shadow:5px 5px 0 rgba(0,0,0,.25);display:flex;gap:.6rem;align-items:center}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.toast .big{font-size:1.6rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:1.6rem;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

@media (max-width:900px){
  .hero-grid,.daily,.d-hero,.d-body,.made-grid,.pantry-grid,.two-col,.stand-hero,.about{grid-template-columns:1fr}
  .bubble{margin-left:0}.mascot{order:-1}.hero .mascot-svg{max-width:340px}
  .ing-panel{position:static}
  .stand-hero .mascot-svg{max-width:300px;margin-inline:auto}
}
@media (max-width:560px){
  .brand img{width:52px}.streak .lbl{display:none}
  .rotd{grid-template-columns:1fr}.rotd .emo{grid-row:auto}
  .grid{grid-template-columns:1fr}.f-grid{grid-template-columns:1fr}
  .cat{min-height:46px;padding-right:.8rem}.cat .ce{width:32px;height:32px;font-size:1.1rem}
  .search,.filters .search{width:100%}.filters .sel{min-width:0;flex:1 1 40%}
  .chal-hero{grid-template-columns:1fr}
  .timeline{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:52px 1fr}.row .end{grid-column:1/-1;justify-content:flex-start}
  .thumb{width:52px;height:52px;font-size:1.6rem}
  .champ{grid-template-columns:80px 1fr}.champ .ph{width:80px;height:80px}
  .cook-nav .btn{min-height:58px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .skater{display:none}
}
</style>

      <p class="lede">We're a home for banana recipes at every stage, from firm and green to spotty and gone. No banana left behind.</p>
      <h2>How it works</h2>
      <p>Browse recipes by category, or use the Pantry Matcher to find something you can make with what's already in your kitchen. Every recipe has a servings scaler, one-tap timers, and a hands-free Cook Mode that keeps your screen awake while you work.</p>
      <p>Tap the heart on anything you want to keep. Saved recipes, badges, and your cooking history live on your Banana Stand, where your mascot picks up new gear as you level up.</p>
      <h2>Come back often</h2>
      <p>There's a new recipe of the day every midnight and a new challenge every Monday. Share a photo of what you made, vote for your favorites, and see whose dish gets crowned at the end of the week.</p>
    </div>
    <aside class="panel">
      <h2>Banana ripeness, decoded</h2>
      <ul class="ripe-guide">
        <li><i style="background:#9CBF45"></i><span><b>Green:</b> starchy and firm. Fry, curry, or pickle.</span></li>
        <li><i style="background:#F3CF31"></i><span><b>Yellow:</b> the snacking sweet spot. Smoothies and quick bites.</span></li>
        <li><i style="background:#EFC33B"></i><span><b>Spotty:</b> sweeter and softer. Pancakes and muffins.</span></li>
        <li><i style="background:#C99A45"></i><span><b>Brown:</b> peak banana bread territory.</span></li>
        <li><i style="background:#4A3322"></i><span><b>Nearly black:</b> bake it into cake or freeze it for nice cream.</span></li>
      </ul>
    </aside>

            const newer = (r.lastVisit || "") >= (state.lastVisit || "") ? r : state;
            state = Object.assign({}, newer, {saved:union(r.saved,state.saved), catsSeen:union(r.catsSeen,state.catsSeen), badges:union(r.badges,state.badges), factIdx:state.factIdx,

/* ================= search ================= */
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const m = Array.from({length:a.length+1}, (_,i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return m[a.length][b.length];
}
const words = s => s.toLowerCase().replace(/[^a-z0-9\s-]/g," ").split(/[\s-]+/).filter(Boolean);
const STOP = new Set(["banana","bananas","the","a","and","with","recipe","recipes"]);
function searchScore(r, qs) {
  const hay = words([r.n, (r.tags||[]).join(" "), (r.i||[]).join(" "), catOf(r.c).name, r.b||""].join(" "));
  let score = 0;
  for (const w of qs) {
    let best = 0;
    for (const h of hay) {
      if (h === w) best = Math.max(best, 3);
      else if (h.startsWith(w) && w.length >= 2) best = Math.max(best, 2);
      else if (w.length >= 4 && h.length >= 4 && lev(w, h) <= (w.length > 6 ? 2 : 1)) best = Math.max(best, 1.5);
    }
    if (!best) return 0;
    score += best;
  }
  for (const w of qs) if (words(r.n).some(h => h.startsWith(w) || (w.length >= 4 && lev(w,h) <= 1))) score += 2;
  return score;
}

      const m = {};
      snap.docs.forEach(d => { const v = d.data(); if (!v || !v.recipe) return; (m[v.recipe] = m[v.recipe] || []).push(Object.assign({}, v, {_id:d.id})); });

    }, () => {});
  } catch (e) {}
}
function ratingOf(id) {
  const rs = (REV[id]||[]).filter(x => x.rating >= 1);
  return rs.length ? {avg: rs.reduce((a,b) => a + b.rating, 0) / rs.length, n: rs.length} : null;
}

  $$("[data-nav]").forEach(a => { if (a.dataset.nav === (p === "recipe" ? "recipes" : p)) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });

function readPhoto(file, maxDim = 1000, limit = 260000) {

}
